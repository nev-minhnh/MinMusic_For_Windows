[package]
name = "minmusic-shell"
version = "2.0.0"
edition = "2021"
description = "MinMusic for Windows shell (Tauri 2)"
authors = ["nev-minhnh"]

[[bin]]
name = "MinMusic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rand = "0.8"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_Shutdown",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
]

[features]
# Test build: enables the test hooks of architecture section 10 (also on in debug builds).
e2e = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
