[package]
name = "minmusic-shell"
version = "2.0.0"
edition = "2021"
description = "MinMusic for Windows shell (Tauri 2)"
authors = ["nev-minhnh"]

[[bin]]
name = "MinMusic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
webview2-com = "0.39"
windows-core = "0.62"
base64 = "0.22"
url = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rand = "0.8"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_Shutdown",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Globalization",
  "Media",
  "Media_Playback",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "Win32_System_WinRT",
  "Win32_System_Com",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
]

[features]
# Test build: enables the test hooks of architecture section 10 (also on in debug builds).
e2e = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
