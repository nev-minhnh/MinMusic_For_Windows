name: Release

# Releases only (owner policy: GitHub Actions is not used for per-push CI).
# Triggers: a pushed tag vMAJOR.MINOR.PATCH[-pre] (the tag must equal src-tauri/tauri.conf.json "version"),
# or a manual run with the tag as input. Steps and secrets: docs/release/release-process.md.
# Unsigned (no Authenticode); update integrity is a minisign key (TAURI_SIGNING_PRIVATE_KEY).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (for example v2.0.0 or v2.0.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  TRIPLE: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (bash scripts)
        run: git config --global core.autocrlf false

      - name: Check out (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          submodules: recursive
          persist-credentials: false

      - name: No ads / no telemetry (R-SEC-5)
        run: bash scripts/check_no_ads.sh

      - name: Tag equals tauri.conf.json version, updater key present
        id: tag
        run: |
          node scripts/ci/check-tag.mjs --selftest
          node scripts/ci/check-tag.mjs "$RELEASE_TAG"

      - name: Check required secrets are set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
          LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
        run: |
          missing=0
          for n in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!n:-}" ]; then echo "::error::secret $n is not set"; missing=1; fi
          done
          # Optional: the core builds without them (Last.fm scrobbling / Lyprio lyrics stay off), as the local builds do.
          # Each pair must be complete or empty (shared/build.gradle.kts requires LYPRIO_* together).
          for n in LASTFM_API_KEY LASTFM_SECRET LYPRIO_BASE_URL LYPRIO_HMAC_KEY; do
            if [ -z "${!n:-}" ]; then echo "::warning::optional secret $n is not set"; fi
          done
          if { [ -z "${LYPRIO_BASE_URL:-}" ] && [ -n "${LYPRIO_HMAC_KEY:-}" ]; } || { [ -n "${LYPRIO_BASE_URL:-}" ] && [ -z "${LYPRIO_HMAC_KEY:-}" ]; }; then
            echo "::error::LYPRIO_BASE_URL and LYPRIO_HMAC_KEY must be set together"; missing=1
          fi
          exit $missing

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build sidecar image (jlink) into sidecar/dist
        working-directory: core/MinMusic
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
          LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
        run: |
          ./gradlew --stacktrace --no-daemon --no-configuration-cache \
            :desktopCore:sidecarImage -PsidecarOut="$(cygpath -m "$GITHUB_WORKSPACE/sidecar/dist")" -Pmetrolist.debug=false
          test -f ../../sidecar/dist/runtime/bin/minmusic-core.exe

      - name: Set up Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm

      - name: Install and build UI and protocol
        run: |
          npm ci
          npm run build

      - name: Unit tests
        run: npm test

      # Report only (W6): the real-core suites still have known failures that are test data or runner environment, not
      # product bugs: synthetic seed ids and fixture album ids are not playable on YouTube, and the hosted runner has no
      # audio endpoint (player.output, eq.device) and no LAN address (Device Connect link). The release gate runs the full
      # contract, app and process suites locally (docs/qa/release-gate.md).
      - name: Contract tests against the real core (offline, report only)
        continue-on-error: true
        env:
          MINMUSIC_OFFLINE: '1'
        run: node tests/contract/run.mjs --target real --suite all --offline

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked

      - name: Build the UI for the bundle (tauri.conf has no beforeBuildCommand)
        run: npm -w ui run build

      - name: Build NSIS installer (signed for the updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target "$TRIPLE" --bundles nsis

      - name: Portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/portable.ps1 -Version $env:VERSION

      - name: Collect release files, sha256, latest.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          nsis="src-tauri/target/$TRIPLE/release/bundle/nsis"
          shopt -s nullglob
          setups=("$nsis"/*-setup.exe)
          [ "${#setups[@]}" -eq 1 ] || { echo "::error::expected one setup in $nsis, found ${#setups[@]}"; exit 1; }
          zips=(dist/MinMusic-*-portable-x64.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::expected one portable zip in dist, found ${#zips[@]}"; exit 1; }
          rm -rf release && mkdir release
          setup="MinMusic-${VERSION}-windows-x64-setup.exe"
          cp "${setups[0]}" "release/$setup"
          cp "${setups[0]}.sig" "release/$setup.sig"
          cp "${zips[0]}" release/
          node scripts/ci/release-notes.mjs "$VERSION" > release/notes.md
          node scripts/make-latest-json.mjs --version "$VERSION" --tag "$RELEASE_TAG" \
            --setup "release/$setup" --sig "release/$setup.sig" --notes-file release/notes.md \
            --repo "$GITHUB_REPOSITORY" --out release/latest.json
          node scripts/ci/hash-assets.mjs "release/$setup" release/MinMusic-*-portable-x64.zip
          ls -l release

      - name: Size limits (I1)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release -Filter '*-setup.exe').FullName
          scripts/size.ps1 -Setup $setup
          if ($LASTEXITCODE -ne 0) { throw "size.ps1 failed ($LASTEXITCODE): I1 breach" }

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=(release/*-setup.exe release/*-setup.exe.sig release/*-portable-x64.zip release/*.sha256 release/latest.json)
          # A prerelease must not become "latest": the updater endpoint is releases/latest/download/latest.json.
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); else flags=(--latest); fi
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" "${flags[@]}" --notes-file release/notes.md -R "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" \
              --verify-tag --title "MinMusic for Windows $VERSION" --notes-file release/notes.md "${flags[@]}"
          fi
