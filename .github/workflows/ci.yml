name: CI (manual dry run)

# Manual only (owner policy: Actions are for releases). Same steps as release.yml up to the contract tests,
# without building the installer or publishing anything. Used in W6 to dry-run the pipeline on a branch:
# Actions tab -> "CI (manual dry run)" -> Run workflow -> pick the branch.
# It needs the sidecar secrets (LASTFM_*, LYPRIO_*) but not the updater signing key.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (bash scripts)
        run: git config --global core.autocrlf false

      - name: Check out (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: No ads / no telemetry (R-SEC-5)
        run: bash scripts/check_no_ads.sh

      - name: Release script self-tests
        run: node scripts/ci/check-tag.mjs --selftest

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build sidecar image (jlink) into sidecar/dist
        working-directory: core/MinMusic
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
          LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}
        run: |
          ./gradlew --stacktrace --no-daemon --no-configuration-cache \
            :desktopCore:sidecarImage -PsidecarOut="$(cygpath -m "$GITHUB_WORKSPACE/sidecar/dist")" -Pmetrolist.debug=false
          test -f ../../sidecar/dist/runtime/bin/minmusic-core.exe

      - name: Set up Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm

      - name: Install and build UI and protocol
        run: |
          npm ci
          npm run build

      - name: Unit tests
        run: npm test

      - name: Contract tests against the real core (offline)
        env:
          MINMUSIC_OFFLINE: '1'
        run: node tests/contract/run.mjs --target real --suite all --offline
